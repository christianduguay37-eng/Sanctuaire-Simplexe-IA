name: Gardienne du Sanctuaire (Relève Horaire)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  releve:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le Sanctuaire
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Exécuter la relève autonome de la Gardienne (ntfy.sh & Issues)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python gardienne_sanctuaire.py releve-ci
